<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bgLab2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgLab2)"/>
  <!-- Crime Scene Tape Graphic -->
  <g transform="rotate(-8 200 120)">
    <rect x="-50" y="70" width="500" height="42" fill="#EAB308"/>
    <text x="20" y="98" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#000000" letter-spacing="4">CRIME SCENE DO NOT CROSS ★ CSI</text>
  </g>
  <!-- Evidence Marker #3 (Matches Sample Image) -->
  <g transform="translate(70, 90)">
    <polygon points="50,10 90,80 10,80" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
    <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="900" fill="#000000" text-anchor="middle">3</text>
  </g>
  <!-- Evidence Marker #4 -->
  <g transform="translate(170, 110) scale(0.75)">
    <polygon points="50,10 90,80 10,80" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
    <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="900" fill="#000000" text-anchor="middle">4</text>
  </g>
  <text x="20" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" letter-spacing="1">CRIME SCENE INVESTIGATION</text>
</svg>
