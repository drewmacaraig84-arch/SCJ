<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="crimBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F254B"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#040D1A"/>
    </linearGradient>
    <linearGradient id="goldCrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyanCrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="crimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring with Tech Accents -->
  <circle cx="100" cy="100" r="96" fill="url(#crimBg)" stroke="url(#goldCrim)" stroke-width="5" filter="url(#crimGlow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#cyanCrim)" stroke-width="2" stroke-dasharray="8,4"/>
  <circle cx="100" cy="100" r="74" fill="#0A192F" stroke="url(#goldCrim)" stroke-width="2.5"/>

  <!-- Laurel Wreath -->
  <g stroke="url(#goldCrim)" fill="url(#goldCrim)" stroke-width="1" opacity="0.9">
    <!-- Left Wreath Leaves -->
    <path d="M 40,95 Q 36,80 44,70 C 42,75 42,85 45,90 Z"/>
    <path d="M 44,70 Q 43,55 54,48 C 50,55 49,63 50,70 Z"/>
    <path d="M 54,48 Q 57,36 70,32 C 65,40 63,47 62,54 Z"/>
    <!-- Right Wreath Leaves -->
    <path d="M 160,95 Q 164,80 156,70 C 158,75 158,85 155,90 Z"/>
    <path d="M 156,70 Q 157,55 146,48 C 150,55 151,63 150,70 Z"/>
    <path d="M 146,48 Q 143,36 130,32 C 135,40 137,47 138,54 Z"/>
  </g>

  <!-- 3 Stars at the Top -->
  <g fill="#FEF08A">
    <polygon points="100,38 102,44 108,44 103,48 105,54 100,50 95,54 97,48 92,44 98,44" />
    <polygon points="85,42 87,47 92,47 88,50 90,55 85,52 81,55 83,50 79,47 84,47" transform="scale(0.8) translate(18, 5)" />
    <polygon points="115,42 117,47 122,47 118,50 120,55 115,52 111,55 113,50 109,47 114,47" transform="scale(0.8) translate(35, 5)" />
  </g>

  <!-- Scales of Justice (Centerpiece) -->
  <g stroke="url(#goldCrim)" stroke-linecap="round">
    <!-- Center Pillar -->
    <line x1="100" y1="58" x2="100" y2="128" stroke-width="4.5" stroke="url(#goldCrim)"/>
    <!-- Top Finial / Spike -->
    <polygon points="100,52 97,58 103,58" fill="url(#goldCrim)"/>
    <circle cx="100" cy="62" r="4" fill="url(#goldCrim)"/>
    <!-- Balance Beam -->
    <line x1="65" y1="72" x2="135" y2="72" stroke-width="3.5" stroke="url(#goldCrim)"/>
    <circle cx="65" cy="72" r="2.5" fill="url(#goldCrim)"/>
    <circle cx="135" cy="72" r="2.5" fill="url(#goldCrim)"/>

    <!-- Left Scale Plate & Chains -->
    <line x1="65" y1="72" x2="55" y2="96" stroke-width="1.2" stroke="#FEF08A"/>
    <line x1="65" y1="72" x2="75" y2="96" stroke-width="1.2" stroke="#FEF08A"/>
    <path d="M 52,96 Q 65,108 78,96 Z" fill="url(#goldCrim)" stroke-width="1.5"/>

    <!-- Right Scale Plate & Chains -->
    <line x1="135" y1="72" x2="125" y2="96" stroke-width="1.2" stroke="#FEF08A"/>
    <line x1="135" y1="72" x2="145" y2="96" stroke-width="1.2" stroke="#FEF08A"/>
    <path d="M 122,96 Q 135,108 148,96 Z" fill="url(#goldCrim)" stroke-width="1.5"/>

    <!-- Pedestal / Base -->
    <polygon points="86,132 114,132 120,138 80,138" fill="url(#goldCrim)"/>
    <line x1="75" y1="138" x2="125" y2="138" stroke-width="3" stroke="url(#goldCrim)"/>
  </g>

  <!-- Bottom Banner with CRIMINOLOGY -->
  <g filter="url(#crimGlow)">
    <path d="M 45,155 L 155,155 L 150,172 L 50,172 Z" fill="#1E3A8A" stroke="url(#goldCrim)" stroke-width="2"/>
    <text x="100" y="168" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="900" fill="#FEF08A" text-anchor="middle" letter-spacing="3">
      CRIMINOLOGY
    </text>
  </g>
</svg>
