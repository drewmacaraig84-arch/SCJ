<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bgLab3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgLab3)"/>
  <!-- DNA Double Helix in Background -->
  <g fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0.35" transform="translate(180, 20)">
    <path d="M 10,20 Q 50,60 10,100 T 10,180"/>
    <path d="M 50,20 Q 10,60 50,100 T 50,180"/>
    <line x1="12" y1="40" x2="48" y2="40"/>
    <line x1="15" y1="80" x2="45" y2="80"/>
    <line x1="12" y1="120" x2="48" y2="120"/>
    <line x1="15" y1="160" x2="45" y2="160"/>
  </g>
  <!-- Chemical Flasks -->
  <g transform="translate(60, 50)">
    <!-- Erlenmeyer Flask -->
    <path d="M 40,20 L 40,50 L 10,110 Q 5,120 15,120 L 75,120 Q 85,120 80,110 L 50,50 L 50,20 Z" fill="none" stroke="#E2E8F0" stroke-width="4"/>
    <path d="M 15,100 L 25,80 L 65,80 L 75,100 Q 80,115 70,115 L 20,115 Q 10,115 15,100 Z" fill="url(#flaskLiquid)" opacity="0.85"/>
    <circle cx="35" cy="95" r="4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="55" cy="102" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  <!-- Test Tubes -->
  <g transform="translate(160, 70)">
    <rect x="0" y="0" width="16" height="75" rx="8" fill="none" stroke="#E2E8F0" stroke-width="3"/>
    <rect x="2" y="35" width="12" height="38" rx="6" fill="#F43F5E" opacity="0.85"/>
    <rect x="24" y="0" width="16" height="75" rx="8" fill="none" stroke="#E2E8F0" stroke-width="3"/>
    <rect x="26" y="25" width="12" height="48" rx="6" fill="#10B981" opacity="0.85"/>
  </g>
  <text x="20" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" letter-spacing="1">FORENSIC SCIENCE &amp; CHEMISTRY</text>
</svg>
