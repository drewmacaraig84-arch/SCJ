<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bgLab1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgLab1)"/>
  <!-- Fingerprint Ridge Loops -->
  <g fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.6" transform="translate(180, 110)">
    <ellipse rx="15" ry="25"/>
    <ellipse rx="30" ry="45"/>
    <ellipse rx="45" ry="65"/>
    <ellipse rx="60" ry="85"/>
    <ellipse rx="75" ry="105"/>
    <path d="M -90,20 C -70,-80 70,-80 90,20"/>
  </g>
  <!-- Magnifying Glass -->
  <g transform="translate(140, 80)">
    <circle cx="60" cy="50" r="45" fill="#0284C7" fill-opacity="0.2" stroke="#FEF08A" stroke-width="5"/>
    <line x1="95" y1="85" x2="140" y2="130" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
    <circle cx="48" cy="38" r="10" fill="#FFFFFF" opacity="0.3"/>
  </g>
  <text x="20" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" letter-spacing="1">CRIMINALISTICS &amp; DACTYLOSCOPY</text>
</svg>
